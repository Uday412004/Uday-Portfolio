<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<img src="images/arrow.png" style="width:2%" title= "click to close">

<body>
     <h1>
        No 1<input type="number" id="t1" value="0"><br>
        No 2<input type="number" id="t2" value="0"><br/><br/>
        Result <input id="r" type="number" value="0" id="t2"><br/><br/>

        <button onclick="f1()">+</button>
        <button onclick="f2()">-</button>
        <button onclick="f3()">*</button>
        <button onclick="f4()">/</button>

        <script>
        
        var n1 =document.getElementById("t1")
        var n2 =document.getElementById("t2")
        var n3 =document.getElementById("r")
        function f1()

        {
            var sum = parseInt(n1.value)+parseInt(n2.value) 
            n3.value=sum
        }

        function f2()
        {
            var sum = parseInt(n1.value)-parseInt(n2.value) 
            n3.value=sum
        }

        function f3()
        {
            var sum = parseInt(n1.value)*parseInt(n2.value) 
            n3.value=sum
        }
        
        function f4()
        {
            var sum = parseInt(n1.value)/parseInt(n2.value) 
            n3.value=sum
        }



        </script>

     </h1>
    
</body>
</html>
