<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

      h1
      {
      text-align:center;
      background-color:rgb(224, 224, 224);
      margin-top:30px;
      }

</style>
<body>
    <script>
        // For Loop
        // break
        // continue

        var n = prompt("Enter a Number to Create Table", "2")

        document.write("<h1>Table of = "+n+"</h1>")

        for(var i = 1;i<=10;i++)
    {
        document.write("<h1>"+n+" * "+i+" = "+n*i+"</h1>")
    }



    document.write("Loop End")

    </script>
</body>
</html>
