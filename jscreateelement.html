<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <a href="jawascriptwork.html">
<img src="images/arrow.png" style="width:2%" title= "click to close">
</a>
    
<body>
    <h1>Creating Tag By JawaScript</h1>

    <script>
   

   var p=document.createElement("img")
   document.body.appendChild(p)
       p.src="images/back5.jpeg"
       p.style="transition:0.50s;margin:20px;border-radius:10px;cursor:pointer;"
       document.title="No Error" 
       p.style.width="30%"
       p.style.boxShadow="10px 10px 10px gray"

       p.onclick=function()
       {
         p.src="images/back6.jpeg"
       }

       p.onmouseout=function()
       {
         p.src="images/back2.jpeg"
         p.style.transform="scale(1)"
       }

       p.onmouseover=function()
       {
         this.style.transform="scale(1.30)"
       }
       
    </script>
</body>
</html>
