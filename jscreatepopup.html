<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

<a href="jawascriptwork.html">
<img src="images/arrow.png" style="width:2%" title= "click to close">
</a>

<style>
    .mystyle
    {
        width:400px;
        height:400px;
        box-shadow:5px 5px 5px rgb(208, 208, 208);
        border:1px black solid;
        padding:5px;
        position:absolute;
        top:100px;
        left:10px;
        border-radius:10px;
        margin-left:40%;
    }
</style>
<body>
    <script>
        var p =document.createElement("div")
        function show()
        {
            document.body.appendChild(p)
            p.className="mystyle"
            p.innerHTML="<button onclick='body.removeChild(p)' style='margin-left:90%;font-size:15px;border:0;'>❌</button>"
            p.innerHTML+="<br/><img style='width:100%' src='images/gif1.gif'>"
            setTimeout("closeadd()",10000)

        }

        document.title="Ready"

        var t = setTimeout("show()",1000)

        function closeadd()
        {
            document.body.removeChild(p)

        }
        

    </script>
</body>
</html>
