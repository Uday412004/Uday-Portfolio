<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

</head>

<a href="jquerywork.html">
<img src="images/arrow.png" style="width:2%" title= "click to close">
</a>

<style>


button{
    display: block;
    margin: 30px auto;
    padding: 12px 30px;
    font-size: 18px;
    background: rgb(62, 67, 105);
    color: white;
    border:none;
    border-radius: 10px;
    cursor: pointer;
    transition: 1s;
}

button:hover{
    background: #5c8fd2;
    transform: translateY(-2px);
}

h1{
    text-align: center;
    margin: 20px;
    color: #807727;
}


</style>

<body>

<button id="b1">Show / Hide</button>
<h1 id="my">Introduction To JQuery</h1>


<script>
    $(document).ready(function()
{
    $("#b1").click(function(){
        $("#my").toggle("fast")
    });

    $(".text").mouseover(function(){
    $(this).css({
        "transition":"2s",
        "background":"lavender",
        "border-radius":"20px",
        
    });
});

$(".text").mouseout(function(){
    $(this).css({
        "transition":"2s",
        "border-radius":"15px",
        "box-shadow":"0px 4px 15px rgba(0,0,0,0.3)"
    });
});
})
</script>

</body>
</html>
