<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<a href="jawascriptwork.html">
<img src="images/arrow.png" style="width:2%" title= "click to close">
</a>

<style>
     #nav
     {
        display:flex;
        justify-content:space-evenly;
     }

     #m,#m2,#m3 {

        width:80px;
        margin-top:2px;
        background:rgb(159, 210, 19);
        color:rgb(20, 20, 20);
        padding:0px;

     }

     li-hover
     {
        background:rgb(20, 20, 20);
        color:rgb(159, 210, 19);
     }

.toggle
{
    display:none;
}

</style>

<body>
     <div< id="nav">

     <div>
        <button onclick="show_hide_menu(event)" id="menu1">   
        Main</button>


        <ol id="m" class="toggle">

         <li>Main</li>
         <li>Practice</li>
         <li>Project</li>
        </ol>

     </div>


     <div>
        <button onclick="show_hide_menu(event)" id="menu2">   
        Project </button>

        <ol id="m2" class="toggle">
          
         <li>Jawa Script</li>
         <li>HTML</li>
         <li>CSS</li>
        </ol>

        </div>


        <div>
        <button onclick="show_hide_menu(event)" id="menu3">   
        Social Media </button>

        <ol id="m3" class="toggle">
          
         <li>Youtube</li>
         <li>Facebook</li>
         <li>Instagram</li>
        </ol>

        </div>
        
        <script>
              var menu_visible = false;
            var m1 = document.getElementById("m");


            function show_hide_menu(event)
            {
                //alert (event.target.id)

                var mid = event.target.id

                m1.classlist.add("toggle");
                m2.classlist.add("toggle");
                m3.classlist.add("toggle");


                switch (mid)
                {
                    case "menu1":
                    m1.classList.remove("toggle");
                    document.title = "Menu1"
                    break;

                    case "menu2":
                    m2.classList.remove("toggle");
                    document.title = "Menu2"
                    break;


                    case "menu3":
                    m3.classList.remove("toggle");
                    document.title = "Menu3"
                    break;

                }
            }

            window.onclick = function(event)
            {
                //alert(event.targrt)
            if((event.target == "[object HTMLHtmlElement]")||(event.target == "[object HTMLUnknownElement]"))
            {
                m1.classList.add("toggle");
                m2.classList.add("toggle");
                m3.classList.add("toggle");
            }
            }

        </script>

</body>
</html>
